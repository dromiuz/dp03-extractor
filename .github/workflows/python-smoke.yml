name: python-smoke

on:
  push:
  pull_request:

jobs:
  ubuntu-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel build

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v

      - name: Smoke-check CLI
        run: |
          python -m dp03extract --help

      - name: Build source and wheel distributions
        run: |
          python -m build

  cross-platform-install-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel build

      - name: Build distributions
        run: |
          python -m build

      - name: Install built wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl

      - name: Smoke-check installed CLI
        run: |
          dp03extract --help

      - name: Smoke-check installed GUI entry point imports
        run: |
          python -c "import dp03app.app; print('dp03app import ok')"
